name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg16 = Postgres 16 oficial + binário da extensão `vector`
        # (schema usa `Unsupported("vector(1536)")` no módulo de Atestados/RAG). A imagem
        # postgres:16-alpine não traz pgvector, o que fazia o `db push` falhar com
        # `type "vector" does not exist` e travava o CI desde o #62.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowcrm
          POSTGRES_PASSWORD: flowcrm_test
          POSTGRES_DB: flowcrm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Generate Prisma Client
        run: cd server && npx prisma generate
        env:
          DATABASE_URL: postgresql://flowcrm:flowcrm_test@localhost:5432/flowcrm_test

      - name: Enable pgvector extension
        # A extensão `vector` é criada por migration SQL manual em prod (não é
        # declarada no datasource), então `db push` não a cria. Habilitamos aqui
        # antes do push para que a coluna `vector(1536)` possa ser sincronizada.
        run: PGPASSWORD=flowcrm_test psql -h localhost -U flowcrm -d flowcrm_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Sync DB schema
        # `db push` em vez de `migrate deploy` — migration 20260320_soft_delete_pattern
        # referencia tabelas que migrations anteriores não criam. Schema canônico é
        # prisma/schema.prisma. Em prod isso já foi resolvido (todas marcadas applied).
        run: cd server && npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: postgresql://flowcrm:flowcrm_test@localhost:5432/flowcrm_test

      - name: Lint
        run: cd server && npm run lint
        continue-on-error: true

      - name: Format check
        run: cd server && npm run format:check
        continue-on-error: true

      - name: Build
        run: cd server && npm run build

      - name: Captura de Demandas — prova em banco real
        # Saldo, idempotência e concorrência só se provam em Postgres de verdade
        # (spec captura-demandas). Sem continue-on-error: se falhar, o job falha. Roda só
        # este arquivo, sobre o banco do serviço `postgres` deste job, já sincronizado pelo
        # `db push` acima, e não depende dos testes antigos que falham no passo seguinte.
        # CAPTURA_BANCO_EXIGIR: se a guarda do arquivo não casar (sem a variável acima, ou com
        # o banco fora de localhost), o passo falha em vez de pular a prova e ficar verde.
        run: cd server && npx vitest run src/__tests__/capturaBancoReal.test.ts
        env:
          DATABASE_URL: postgresql://flowcrm:flowcrm_test@localhost:5432/flowcrm_test
          JWT_SECRET: test-jwt-secret-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-ci
          NODE_ENV: test
          CAPTURA_BANCO_DESCARTAVEL: '1'
          CAPTURA_BANCO_EXIGIR: '1'

      - name: Test
        # continue-on-error: tests pré-existentes têm bugs (Redis ECONNREFUSED,
        # RESEND_API_KEY não configurado em CI). Tratar separadamente sem
        # bloquear pipeline de deploy.
        continue-on-error: true
        run: cd server && npm test -- --run
        env:
          DATABASE_URL: postgresql://flowcrm:flowcrm_test@localhost:5432/flowcrm_test
          JWT_SECRET: test-jwt-secret-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-ci
          NODE_ENV: test

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate do design-system (spec design-system-migration, Fase 8): 0 cor
      # codificada. BLOQUEANTE — sem continue-on-error, um hex faz o CI falhar.
      - name: Design System — gate de cores
        run: npm run check:colors && npm run lint:css

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check
        continue-on-error: true

      # A suite de frontend existia mas não rodava em lugar nenhum (nem aqui,
      # nem no .husky/pre-commit, que só roda os gates de cor). Entra como gate
      # BLOQUEANTE porque está verde — 12 arquivos, 79 testes.
      - name: Test
        run: npm test

      - name: Typecheck (ratchet — fails only on NEW type errors above baseline)
        run: npm run typecheck:ci

      - name: Build
        run: npm run build

  # Deploy é feito pelas integrações nativas das plataformas, não pelo CI:
  #   - Backend  → Railway (auto-deploy via webhook GitHub no push para main)
  #   - Frontend → Vercel  (auto-deploy via integração GitHub no push para main)
  # Não duplicamos aqui: um job de deploy no CI criaria um segundo deploy do mesmo
  # commit. Este workflow serve apenas de gate de qualidade (lint/build/test).
